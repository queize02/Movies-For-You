<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#141414">
    <title>Extracteur MFY</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
    <style>
        html {
            color-scheme: dark;
        }
        html, body { background: #141414; color: white; font-family: sans-serif; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: 40px auto; background: #1f1f1f; padding: 30px; border-radius: 8px; text-align: left; }
        label { font-weight: bold; margin-top: 15px; display: block; color: #ccc; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 4px; border: 1px solid #333; background: #333; color: white; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 15px; background: #e50914; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 1.1rem;}
        button:hover { background: #f40612; }
        .terminal { background: #000; color: #0f0; font-family: monospace; padding: 15px; border-radius: 4px; height: 300px; overflow-y: auto; margin-top: 20px; line-height: 1.4; word-wrap: break-word; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="{{ url_for('admin_dashboard') }}" style="color: #e50914; text-decoration: none; font-weight: bold;">← Retour au Dashboard</a>
        <h2 style="margin-top: 20px; color: white;">Robot Extracteur MFY</h2>
        
        {% if is_extracting %}
            <p style="color: orange; font-weight: bold; font-size: 1.1rem;">⏳ Une extraction est en cours en arrière-plan...</p>
            <div class="terminal" id="terminal">Chargement des logs...</div>
            
            <h3 style="margin-top: 30px; color: white; font-size: 1.1rem;">📸 Vue en direct du navigateur :</h3>
            <div style="background: #000; border: 2px dashed #444; border-radius: 6px; overflow: hidden; margin-top: 10px; text-align: center; padding: 5px;">
                <img id="screenshot_img" src="{{ url_for('static', filename='extraction_screenshot.png') }}" alt="Chargement de l'aperçu..." style="max-width: 100%; height: auto; display: block; margin: 0 auto; min-height: 180px; object-fit: contain; background: #222;">
            </div>
    <script>
                function updateLogs() {
                    fetch('/api/extract/status')
                        .then(r => r.json())
                        .then(data => {
                            const term = document.getElementById('terminal');
                            term.innerHTML = data.logs.join('<br>') + (data.is_extracting ? '<br><span style="animation: blink 1s infinite;">_</span>' : '<br><br><b style="color:white;">✅ Processus terminé.</b>');
                            term.scrollTop = term.scrollHeight;
                            
                            // Mettre à jour l'image en direct avec un paramètre pour contourner le cache
                            const img = document.getElementById('screenshot_img');
                            if (img) {
                                img.src = "/static/extraction_screenshot.png?t=" + new Date().getTime();
                            }
                            
                            if (data.is_extracting) {
                                setTimeout(updateLogs, 1500);
                            }
                        })
                        .catch(err => {
                            setTimeout(updateLogs, 2500);
                        });
                }
                updateLogs();
            </script>
            <style>@keyframes blink { 50% { opacity: 0; } }</style>
        {% else %}
            <form method="POST">
                <label>Type de média :</label>
                <select name="media_type" id="media_type" onchange="toggleFields()">
                    <option value="serie">Série</option>
                    <option value="film">Film</option>
                </select>

                <label>URL Source :</label>
                <input type="text" name="url" placeholder="ex: https://fs15.lol/... ou https://vidzy.com/..." required>
                
                <div id="serie_fields">
                    <label>Numéro de Saison :</label>
                    <input type="number" name="saison" id="saison" placeholder="ex: 1">
                    
                    <label>Nombre d'épisodes :</label>
                    <input type="number" name="nb_eps" id="nb_eps" placeholder="ex: 8">
                </div>
                
                <label>ID en Base de données :</label>
                <input type="number" name="media_id" placeholder="ex: 15" required>
                
                <button type="submit">🚀 Lancer l'extraction</button>
            </form>
            <script>
                function toggleFields() {
                    const type = document.getElementById('media_type').value;
                    const serieFields = document.getElementById('serie_fields');
                    const saison = document.getElementById('saison');
                    const nbEps = document.getElementById('nb_eps');
                    if (type === 'film') {
                        serieFields.classList.add('hidden');
                        saison.removeAttribute('required');
                        nbEps.removeAttribute('required');
                    } else {
                        serieFields.classList.remove('hidden');
                        saison.setAttribute('required', 'required');
                        nbEps.setAttribute('required', 'required');
                    }
                }
                toggleFields();
            </script>
        {% endif %}
    </div>
</body>
</html>
